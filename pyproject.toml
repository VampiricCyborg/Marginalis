[project]
name = "marginalis"
version = "0.1.0"
description = "Marginal vs. average CO2 emissions factors from EIA-930 hourly grid data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "pandas>=2.2",
    "pyarrow>=17",
    "pandera>=0.20",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.2",
    "openpyxl>=3.1",
    "python-calamine>=0.8.2",
]

[project.scripts]
marginalis = "marginalis.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marginalis"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
