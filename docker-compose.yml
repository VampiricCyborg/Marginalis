services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: marginalis
      POSTGRES_PASSWORD: marginalis
      POSTGRES_DB: marginalis
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marginalis"]
      interval: 2s
      retries: 30

volumes:
  pgdata:
